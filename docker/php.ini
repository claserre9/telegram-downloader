; PHP settings for the Docker image.
; E in variables_order exposes the variables from .env (passed by docker compose) through $_ENV.
variables_order = "EGPCS"
; MadelineProto keeps the account's chats and peers in memory (several hundred MB for large accounts).
memory_limit = -1
max_execution_time = 0
; The built-in web server is a CLI process, so the CLI OPcache also speeds up web requests.
opcache.enable_cli = 1
display_errors = Off
log_errors = On
error_log = /dev/stderr
